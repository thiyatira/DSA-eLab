<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eLab C Challenges & Solutions Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Marked.js for markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- KaTeX for math formulas and symbol rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension/lib/index.umd.js"></script>
  <!-- Prism.js for syntax highlighting -->
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-c.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">
  <div class="app-container">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-left">
        <button id="menuToggle" class="icon-btn menu-btn" title="Toggle Navigation Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="brand-logo">
          <span class="logo-icon">⚡</span>
          <div class="logo-text">
            <h1>eLab C Explorer</h1>
            <span class="subtext">40 Level 2 Challenges & Solutions</span>
          </div>
        </div>
      </div>
      
      <div class="header-center">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="searchInput" placeholder="Search challenges, keywords, problems..." autocomplete="off">
          <button id="clearSearch" class="clear-btn" title="Clear search">&times;</button>
        </div>
      </div>

      <div class="header-right">
        <div class="stats-badge" id="statsBadge">
          <span class="solved-count">0</span>/40 Solved
        </div>
        <button id="themeToggle" class="icon-btn" title="Toggle Theme">
          <span class="theme-icon">🌙</span>
        </button>
      </div>
    </header>

    <div class="main-layout">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <!-- Sidebar Navigation -->
      <aside class="sidebar" id="sidebar">
        <div class="filter-pills" id="topicFilter">
          <button class="pill active" data-topic="all">All</button>
          <button class="pill" data-topic="Searching">Searching</button>
          <button class="pill" data-topic="Sorting">Sorting</button>
          <button class="pill" data-topic="Arrays">Arrays</button>
          <button class="pill" data-topic="Linked List">Linked List</button>
        </div>

        <div class="challenges-list" id="challengesList">
          <!-- Populated by app.js -->
        </div>
      </aside>

      <!-- Main Content Viewer -->
      <main class="content-viewport">
        <div class="content-toolbar">
          <div class="toolbar-left">
            <span class="badge topic-badge" id="currentTopic">Topic</span>
            <h2 id="currentTitle">Select a Challenge</h2>
          </div>

          <div class="toolbar-center">
            <div class="view-toggle">
              <button class="view-btn" data-view="split">Split View</button>
              <button class="view-btn" data-view="question">Problem Only</button>
              <button class="view-btn active" data-view="solution">Solution Only</button>
            </div>
          </div>

          <div class="toolbar-right">
            <button id="copyCodeBtn" class="action-btn primary-btn" title="Copy C Code">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>Copy C Code</span>
            </button>
            <button id="prevBtn" class="icon-btn nav-btn" title="Previous (Left Arrow)">◀</button>
            <button id="nextBtn" class="icon-btn nav-btn" title="Next (Right Arrow)">▶</button>
          </div>
        </div>

        <div class="content-panels" id="contentPanels">
          <!-- Question Panel -->
          <section class="panel question-panel" id="questionPanel">
            <div class="panel-header">
              <h3>Problem Description</h3>
            </div>
            <div class="panel-body markdown-content" id="questionBody">
              <!-- Rendered Question Markdown -->
            </div>
          </section>

          <!-- Solution Panel -->
          <section class="panel solution-panel" id="solutionPanel">
            <div class="panel-header">
              <div class="panel-header-title">
                <h3>Solution & Approach</h3>
                <span id="solutionStatusBadge" class="badge">Ready</span>
              </div>
            </div>
            <div class="panel-body markdown-content" id="solutionBody">
              <!-- Rendered Solution Markdown -->
            </div>
          </section>
        </div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast">Copied to clipboard!</div>

  <!-- Load challenges data -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
